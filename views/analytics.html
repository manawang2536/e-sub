<!-- views/analytics.php -->
<div id="view-analytics" class="view-section view-hidden h-full flex flex-col space-y-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100 gap-4">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">สรุปสารสนเทศการประเมิน</h2>
            <p class="text-sm text-gray-500 mt-1">ภาพรวมผลการนิเทศการจัดการเรียนรู้ของโรงเรียน</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="w-32">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">ปีการศึกษา</label>
                <select id="analyticsYear" onchange="loadAnalyticsData()" class="w-full border-gray-300 rounded-lg text-sm focus:ring-school focus:border-school">
                    <option value="all">ทั้งหมด</option>
                    <option value="2566">2566</option>
                    <option value="2567">2567</option>
                    <option value="2568">2568</option>
                    <!-- These will be populated by JS or just hardcoded for now, but better to populate from settings -->
                </select>
            </div>
            <div class="w-32">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">ภาคเรียน</label>
                <select id="analyticsTerm" onchange="loadAnalyticsData()" class="w-full border-gray-300 rounded-lg text-sm focus:ring-school focus:border-school">
                    <option value="all">ทั้งหมด</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>
            <button onclick="loadAnalyticsData()" class="mt-5 bg-school text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-800 transition">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl p-6 text-white shadow-md relative overflow-hidden group hover:-translate-y-1 transition duration-300">
            <div class="absolute -right-4 -top-4 opacity-20 transform group-hover:scale-110 transition duration-300">
                <i class="fas fa-clipboard-check text-8xl"></i>
            </div>
            <p class="text-blue-100 text-sm font-medium mb-1">จำนวนการนิเทศทั้งหมด</p>
            <h3 class="text-4xl font-bold" id="stat-total-records">0</h3>
            <p class="text-blue-200 text-xs mt-2">ครั้ง</p>
        </div>
        
        <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-6 text-white shadow-md relative overflow-hidden group hover:-translate-y-1 transition duration-300">
            <div class="absolute -right-4 -top-4 opacity-20 transform group-hover:scale-110 transition duration-300">
                <i class="fas fa-chalkboard-teacher text-8xl"></i>
            </div>
            <p class="text-emerald-100 text-sm font-medium mb-1">จำนวนครูผู้สอนที่รับการนิเทศ</p>
            <h3 class="text-4xl font-bold" id="stat-total-teachers">0</h3>
            <p class="text-emerald-200 text-xs mt-2">คน</p>
        </div>
        
        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-6 text-white shadow-md relative overflow-hidden group hover:-translate-y-1 transition duration-300">
            <div class="absolute -right-4 -top-4 opacity-20 transform group-hover:scale-110 transition duration-300">
                <i class="fas fa-chart-line text-8xl"></i>
            </div>
            <p class="text-indigo-100 text-sm font-medium mb-1">คะแนนเฉลี่ยภาพรวม</p>
            <h3 class="text-4xl font-bold" id="stat-avg-score">0.00</h3>
            <p class="text-indigo-200 text-xs mt-2">เปอร์เซ็นต์ (%)</p>
        </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1 min-h-[400px]">
        <!-- Pie Chart -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col">
            <h3 class="text-lg font-bold text-gray-800 mb-4">สัดส่วนคุณภาพผลการประเมิน</h3>
            <div class="flex-1 relative min-h-[300px]">
                <canvas id="analyticsLevelChart"></canvas>
            </div>
        </div>
        
        <!-- Bar Chart -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col">
            <h3 class="text-lg font-bold text-gray-800 mb-4">คะแนนเฉลี่ยแยกตามกลุ่มสาระการเรียนรู้</h3>
            <div class="flex-1 relative min-h-[300px]">
                <canvas id="analyticsDeptChart"></canvas>
            </div>
        </div>
    </div>
</div>
